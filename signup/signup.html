<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - DentaNueva Dental Clinic</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="signup.css" />
  </head>
  <body>
    <div class="auth-card" id="authCard">
      <div class="auth-header">
        <h1 class="auth-title">Create an Account</h1>
      </div>
      <form class="auth-form" action="signup.php" method="POST">
        <div class="name-row">
          <div class="form-group">
            <label class="form-label" for="firstname">First Name</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-user"></i>
              <input
                type="text"
                id="firstname"
                name="firstname"
                class="form-input"
                placeholder="John"
                required
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="lastname">Last Name</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-user"></i>
              <input
                type="text"
                id="lastname"
                name="lastname"
                class="form-input"
                placeholder="Doe"
                required
              />
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-with-icon">
            <i class="fa-regular fa-envelope"></i>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="name@example.com"
              required
            />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input password-input"
              placeholder="Create a password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              id="togglePasswordBtn"
              aria-label="Toggle password visibility"
            >
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
          <ul id="passwordRequirements" class="password-rules">
            <li id="lengthRule" class="invalid">At least 8 characters</li>
            <li id="upperRule" class="invalid">
              At least one uppercase letter (A-Z)
            </li>
            <li id="numberRule" class="invalid">At least one number (0-9)</li>
            <li id="specialRule" class="invalid">
              At least one special character (e.g., @, _, #, $)
            </li>
          </ul>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password"
            >Confirm Password</label
          >
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              class="form-input password-input"
              placeholder="Confirm your password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              id="toggleConfirmBtn"
              aria-label="Toggle password visibility"
            >
              <i class="fa-regular fa-eye" id="eyeIconConfirm"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Sign Up</button>
        <p class="auth-footer-text">
          Already have an account? <a href="../login/login.html">Log In</a>
        </p>
      </form>
    </div>
    <script src="signup.js"></script>
  </body>
</html>
