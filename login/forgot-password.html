<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - DentaNueva Dental Clinic</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo"
          ><i class="fa-solid fa-tooth" aria-hidden="true"></i
        ></span>
        <div class="auth-tag">Account Recovery</div>
        <h1 class="auth-title">Forgot Password?</h1>
        <p class="auth-subtitle">
          Enter your registered email to reset your password.
        </p>
      </div>
      <div class="auth-body">
        <div
          id="resetMessage"
          class="error-message-box"
          role="status"
          aria-live="polite"
          style="display: none"
        ></div>
        <form id="forgotPasswordForm" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-with-icon">
              <i class="fa-regular fa-envelope" aria-hidden="true"></i>
              <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
            </div>
          </div>
          <button type="submit" class="btn-submit">Continue</button>
          <p class="auth-footer-text">
            Remember your password? <a href="login.html">Back to Log In</a>
          </p>
        </form>
      </div>
    </div>
    <script src="forgot-password.js"></script>
  </body>
</html>
