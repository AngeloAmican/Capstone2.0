<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset Password - DentaNueva Dental Clinic</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="login.css" />
    <style>
      .auth-body {
        min-width: 0;
      }
      .input-with-icon {
        position: relative;
      }
      .input-with-icon .form-input {
        width: 100%;
        box-sizing: border-box;
        padding-right: 48px;
      }
      .password-toggle {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #64748b;
        font-size: 16px;
        cursor: pointer;
        z-index: 2;
      }
      .password-toggle:hover {
        background: #ecfdf5;
        color: #047857;
      }
      .password-toggle:focus-visible {
        outline: 2px solid #059669;
        outline-offset: 2px;
      }
      #resetMessage {
        line-height: 1.6;
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 12px;
      }
      #successLoginLink {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #e2e8f0;
        text-align: center;
      }
      #successLoginLink a,
      .auth-footer-text a {
        color: #078443;
        font-weight: 600;
        text-decoration: none;
      }
      #successLoginLink a:hover,
      .auth-footer-text a:hover {
        text-decoration: underline;
      }
      .btn-submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo"
          ><i class="fa-solid fa-tooth" aria-hidden="true"></i
        ></span>
        <div class="auth-tag">Account Security</div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Create a new password for your account.</p>
      </div>
      <div class="auth-body">
        <div
          id="resetMessage"
          class="error-message-box"
          role="status"
          aria-live="polite"
          style="display: none"
        ></div>
        <form id="resetPasswordForm" class="auth-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-lock" aria-hidden="true"></i>
              <input
                type="password"
                id="newPassword"
                name="password"
                class="form-input"
                placeholder="Enter new password"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-target="newPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <i class="fa-regular fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword"
              >Confirm New Password</label
            >
            <div class="input-with-icon">
              <i class="fa-solid fa-lock" aria-hidden="true"></i>
              <input
                type="password"
                id="confirmPassword"
                name="confirm_password"
                class="form-input"
                placeholder="Confirm new password"
                autocomplete="new-password"
                minlength="8"
                maxlength="128"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-target="confirmPassword"
                aria-label="Show password"
                aria-pressed="false"
              >
                <i class="fa-regular fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-submit">Save New Password</button>
          <p class="auth-footer-text">
            <a href="login.html">Back to Log In</a>
          </p>
        </form>
        <p id="successLoginLink" class="auth-footer-text" style="display: none">
          <a href="login.html">Back to Log In</a>
        </p>
      </div>
    </div>
    <script src="reset-password.js"></script>
  </body>
</html>
